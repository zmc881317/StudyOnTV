name: Build debug APKs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-banks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate question banks
        run: python3 scripts/validate_banks.py

  build:
    needs: validate-banks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build mobile + TV debug APKs
        working-directory: app/native
        run: gradle --no-daemon --stacktrace assembleMobileDebug assembleTvDebug

      - name: Upload mobile debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnTV-mobile-debug
          path: app/native/app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error

      - name: Upload TV debug APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyOnTV-tv-debug
          path: app/native/app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
